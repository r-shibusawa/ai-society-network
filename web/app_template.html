<script>
const DATA = /*__DATA__*/;

/* ============================================================ 共通ユーティリティ */
const $ = (s, el = document) => el.querySelector(s);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let PAL = [];
function readPalette() { PAL = [1,2,3,4,5,6,7,8].map(i => css(`--c${i}`)); }
readPalette();
const fmt = (v, d = 3) => v == null ? "—" : (Math.abs(v) >= 100 ? Math.round(v).toLocaleString() : (+v).toFixed(d).replace(/\.?0+$/, ""));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function rng(seed) { let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }

/* ============================================================ タブ定義 */
const TABS = [
  { key: "fb", label: "入門：SNSの友達" },
  { key: "hf_models", label: "AIモデルの家系図" },
  { key: "hf_orgs", label: "AI開発組織のつながり" },
  { key: "pypi", label: "AIソフトウェア依存" },
  { key: "collab", label: "AI研究の国際共著" },
  { key: "polblogs", label: "政治ブログの分断" },
  { key: "pheme", label: "うわさへの反応" },
  { key: "lab", label: "実験室" },

const WORK = {
  fb: ["色（自動で見つけたグループ）は，どんな友達の集まり（中学・高校・大学・バイト先など）にあたりそう？",
       "実験1でまず結果を予想してから，「ハブを1つ削除」で「あなた」を取り除こう。予想と同じだった？",

       "「色＝本人が分けた友達グループ」に切り替え，自動で見つけたグループと比べよう。"],
  hf_models: ["派生モデル数（入次数）が多い基盤モデルの上位3つは？ 開発元はどこ？",

            "ハブを狙って削除すると，つながりはどれくらい早く崩れる？ ランダム削除と比べよう。",
            "AIの開発が一部の組織に集中することの良い面・悪い面を考えよう。"],
  pypi: ["最も多くのライブラリに依存されているのは？ 名前を聞いたことはある？",

         "「ランダム故障」と「ハブ狙い撃ち」の崩れ方の違いを説明しよう。"],
  collab: ["2014→2019→2024 で「平均距離」と「国際共著率」はどう変わった？",
           "論文数（大きさ）と媒介中心性（大きさを切替）で，上位の国は同じ？ 違う？",
           "日本はどこにいる？ 日本と最も多く共著している国は？"],
  polblogs: ["色は政治的立場。2つのグループはどのくらい分かれている？「立場をまたぐリンク率」は何%？",
             "実験2で，リベラル側の最大ハブから情報を広げてみよう。保守側にはどれくらい届く？",
             "このような分断は，推薦アルゴリズムのあるSNSでは強まる？弱まる？ 理由も考えよう。"],
  pheme: ["事件と種類を選び，時間スライダーを動かして返信が広がる様子を見よう。最初の1時間で何割に達する？",

          "なぜ未確認の情報ほど速く反応が集まるのだろう？ 自分がSNSで同じ状況になったらどうする？"],

const GLOSS = [
  ["ノード／エッジ", "点（人・モデル・ソフト・国）と，それらを結ぶ線（関係）。"],
  ["次数", "ノードにつながっているエッジの数。有向グラフでは「入次数（指される数）」と「出次数（指す数）」に分かれる。"],
  ["媒介中心性", "他のノード同士の最短経路の上にどれだけ乗っているか。「橋渡し役」の度合い。"],
  ["PageRank", "重要なノードから指されるほど重要，という考えでつけた点数。Google 検索の基礎になった。"],
  ["クラスター係数", "自分の友達同士も友達である割合。「友達の友達は友達」の度合い。"],

  ["コミュニティ", "内部では密に，外部とは疎につながったグループ。ルーヴァン法で検出。"],
  ["最大のまとまり（最大連結成分）", "線をたどって互いに行き来できるノードの集まりのうち，いちばん大きいもの。ネットワークがどれだけ一体になっているかの指標。"],
];

/* ============================================================ ネットワークの準備 */
function prepare(d) {
  if (d._ready) return d;
  const idx = new Map(d.nodes.map((n, i) => [n.id, i]));
  d.idx = idx;
  d.E = d.links.map(e => [idx.get(e.s), idx.get(e.t), e.w || 1]);
  d.adj = d.nodes.map(() => []);      // 無向の隣接リスト
  d.inn = d.nodes.map(() => []);      // 有向: 自分を指しているノード（派生側・利用側）
  for (const [a, b] of d.E) { d.adj[a].push(b); d.adj[b].push(a); d.inn[b].push(a); }
  d.maxW = d3.max(d.E, e => e[2]) || 1;
  d._ready = true;
  return d;
}

function giantShare(d, removed) {
  const n = d.nodes.length, seen = new Uint8Array(n); let best = 0;
  for (let i = 0; i < n; i++) {
    if (seen[i] || removed.has(i)) continue;
    let size = 0; const st = [i]; seen[i] = 1;
    while (st.length) { const v = st.pop(); size++; for (const u of d.adj[v]) if (!seen[u] && !removed.has(u)) { seen[u] = 1; st.push(u); } }
    if (size > best) best = size;
  }
  return best / n;
}
// 取り除いた後の「まとまり」（連結成分）の数と最大のまとまりの割合
function components(d, removed) {
  const n = d.nodes.length, seen = new Uint8Array(n); let best = 0, count = 0;
  for (let i = 0; i < n; i++) {
    if (seen[i] || removed.has(i)) continue;
    let size = 0; const st = [i]; seen[i] = 1; count++;
    while (st.length) { const v = st.pop(); size++; for (const u of d.adj[v]) if (!seen[u] && !removed.has(u)) { seen[u] = 1; st.push(u); } }
    if (size > best) best = size;
  }
  return { count, giant: best / n };
}
// 点が何を表すか（タブを切り替えるたびに図の左上に表示）
const NODE_NOTE = { fb: "点＝友達（「あなた」は本人）", hf_models: "点＝AIモデル", hf_orgs: "点＝AIの開発組織",
  pypi: "点＝Python の部品（ライブラリ）", collab: "点＝国", polblogs: "点＝政治ブログ" };

/* ============================================================ 表示状態 */
const S = {
  tab: "fb", year: "2024", d: null,

  pr: null, flow: null, paint: false, paintG: 0, paintNb: false, trace: null,
  removed: new Set(), removedLog: [], infected: null, infHist: [],

};

let W = 0, H = 0, DPR = 1, quad = null;

function dsKey() { return S.tab === "collab" ? `collab_${S.year}` : S.tab; }

function sizeOptions(d) {
  const o = [["deg", "次数"], ["btw", "媒介中心性"], ["pr", "PageRank"]];
  if (d.directed) o.splice(1, 0, ["in", "入次数（指される数）"]);

  if (d.nodes[0].strength != null) o.push(["strength", "重み付き次数"]);
  if (d.nodes[0].affected != null) o.push(["affected", "影響が及びうる数"]);
  if (d.nodes[0].downloads !== undefined) o.push(["downloads", "ダウンロード数"]);
  return o;
}
function colorOptions(d) {
  const o = [["comm", "コミュニティ"]];
  if (d.nodes[0].lean) o.unshift(["lean", "政治的立場"]);
  if (d.nodes[0].circle) o.push(["circle", "本人が分けた友達グループ"]);
  if (d.nodes[0].org) o.push(["org", "開発組織"]);
  if (d.nodes[0].seed !== undefined) o.push(["seed", "主要AIライブラリか"]);
  return o;
}

/* 色：上位8カテゴリだけ色を割り当て，残りは「その他」。色はカテゴリに固定（順位で塗り替えない） */
function colorMap(d) {
  const key = S.colorBy;
  if (key === "_comp") {
    // まとまり（連結成分）ごとに色分け：大きい順に色を付け，1点だけのまとまりは灰色
    const ci = compIds(d, S.removed), order = ci.sizes.map((sz, c) => [sz, c]).sort((a, b) => b[0] - a[0]);
    const rank = new Map(order.map(([, c], r) => [c, r]));
    const multi = order.filter(([sz]) => sz > 1), singles = order.length - multi.length;
    const idx = n => { const i = d.idx.get(n.id), c = ci.id[i]; if (c < 0 || ci.sizes[c] === 1) return -1; const r = rank.get(c); return r < 8 ? r : -1; };
    return { get: n => ci.id[d.idx.get(n.id)], idx,
      legend: multi.slice(0, 8).map(([sz], r) => [`まとまり${r + 1}（${sz}点）`, r, sz]),
      more: multi.length > 8 || singles > 0, moreLabel: singles ? `1点だけ（${singles}点）` + (multi.length > 8 ? "・その他" : "") : "その他" };
  }
  const get = n => key === "seed" ? (n.seed ? "主要AIライブラリ（起点）" : "依存先") : n[key];
  const cnt = d3.rollup(d.nodes, v => v.length, get);
  const cats = [...cnt.entries()].sort((a, b) => b[1] - a[1]).map(e => e[0]);
  const top = cats.slice(0, 8);
  const m = key === "lean" ? new Map([["リベラル", 0], ["保守", 7]]) : key === "_grp" ? new Map(d3.range(8).map(g => [g, g])) : new Map(top.map((c, i) => [c, i]));
  const label = c => key === "comm" || key === "_grp" ? `グループ${c + 1}` : c;
  return { get, idx: n => m.has(get(n)) ? m.get(get(n)) : -1, legend: top.map(c => [label(c), m.get(c), cnt.get(c)]), more: cats.length > 8 };
}

function radiusFn(d) {
  const key = S.sizeBy, n = d.nodes.length;
  // PageRank の計算中は，最終的な値の最大を基準にして，くり返しのたびに大きさが変わる様子を見せる
  const max = key === "_pr" ? d3.max(d.nodes, x => x.pr) * 1.15 : (d3.max(d.nodes, x => x[key] || 0) || 1);
  const rmin = n > 1000 ? 1.6 : n > 300 ? 2.4 : n > 60 ? 3.2 : 5;
  const rmax = n > 1000 ? 16 : n > 300 ? 18 : n > 60 ? 20 : 18;
  return x => rmin + (rmax - rmin) * Math.sqrt(Math.max(0, x[key] || 0) / max);
}

/* ============================================================ 描画 */
function resize() {
  const r = cv.getBoundingClientRect();
  DPR = window.devicePixelRatio || 1; W = r.width; H = r.height;
  cv.width = W * DPR; cv.height = H * DPR;
  if (S.d) { fitScales(S.d); draw(); }
}

function fitScales(d) {
  // 大きなネットワークは外れた点に引っ張られないよう，上下0.5%を除いた範囲で全体表示する
  const q = d.nodes.length > 300 ? .005 : 0;
  const qx = d.nodes.map(n => n.x).sort(d3.ascending), qy = d.nodes.map(n => n.y).sort(d3.ascending);
  const xs = [d3.quantileSorted(qx, q), d3.quantileSorted(qx, 1 - q)], ys = [d3.quantileSorted(qy, q), d3.quantileSorted(qy, 1 - q)];
  const pad = 40, top = 56, bottom = 46;
  const sw = (W - pad * 2) / (xs[1] - xs[0] || 1), sh = (H - top - bottom) / (ys[1] - ys[0] || 1);
  const s = Math.min(sw, sh);
  const cx = (xs[0] + xs[1]) / 2, cy = (ys[0] + ys[1]) / 2;
  S.sx = x => W / 2 + (x - cx) * s; S.sy = y => (top + (H - bottom)) / 2 + (y - cy) * s;
  quad = d3.quadtree().x(n => S.sx(n.x)).y(n => S.sy(n.y)).addAll(d.nodes);
}

function draw() {
  const d = S.d; if (!d) return;
  const cm = colorMap(d), R = radiusFn(d), t = S.t;
  const edge = css("--edge"), other = css("--other"), hl = css("--hl"), bad = css("--bad"), panel = css("--panel");
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save(); ctx.translate(t.x, t.y); ctx.scale(t.k, t.k);
  const P = n => [S.sx(n.x), S.sy(n.y)];
  const focus = S.sel >= 0 ? S.sel : -1;
  const nbr = focus >= 0 ? new Set(d.adj[focus]) : null;
  const inf = S.infected;
  // まとまり（連結成分）を枠で囲む：点の色（グループ）とは別に，背景に枠を描く
  let frames = null;
  if (S.compFrame) {
    const ci = compIds(d, S.removed), groups = new Map();
    d.nodes.forEach((n, i) => { const c = ci.id[i]; if (c < 0 || ci.sizes[c] < 2) return; if (!groups.has(c)) groups.set(c, []); groups.get(c).push(P(n)); });
    frames = [...groups.values()].sort((a, b) => b.length - a.length);
    const pad = 14 / t.k, ring = css("--ink2"), fill = css("--bg");
    frames.forEach((pts, r) => {
      const hull = pts.length >= 3 ? (d3.polygonHull(pts) || pts) : pts;
      const path = () => { ctx.beginPath(); hull.forEach(([x, y], k) => k ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); if (hull.length > 2) ctx.closePath(); };
      ctx.lineJoin = "round"; ctx.lineCap = "round";
      ctx.globalAlpha = 1; ctx.strokeStyle = ring; ctx.lineWidth = pad * 2 + 3 / t.k; path(); ctx.stroke(); if (hull.length > 2) { ctx.fillStyle = ring; ctx.fill(); }
      ctx.strokeStyle = fill; ctx.lineWidth = pad * 2; path(); ctx.stroke(); if (hull.length > 2) { ctx.fillStyle = fill; ctx.fill(); }
    });
    ctx.lineJoin = "miter"; ctx.lineCap = "butt";
    S.frameInfo = { n: frames.length, sizes: frames.map(f => f.length), singles: ci.sizes.filter(x => x === 1).length };
  }
  // エッジ
  const base = d.nodes.length > 1000 ? .35 : .55;
  for (const [a, b, w] of d.E) {
    if (S.removed.has(a) || S.removed.has(b)) continue;
    if (S.crossOnly && d.nodes[a].lean && d.nodes[a].lean === d.nodes[b].lean) continue;
    const on = focus >= 0 && (a === focus || b === focus);
    const [x1, y1] = P(d.nodes[a]), [x2, y2] = P(d.nodes[b]);
    ctx.globalAlpha = focus >= 0 ? (on ? .95 : .08) : base;
    ctx.strokeStyle = on ? hl : edge;
    ctx.lineWidth = ((d.maxW > 1 ? .4 + 5 * Math.sqrt(w / d.maxW) : (on ? 1.4 : .7))) / Math.sqrt(t.k);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    if (on && d.directed) arrow(x1, y1, x2, y2, R(d.nodes[b]) / Math.sqrt(t.k), hl, t.k);
  }
  ctx.globalAlpha = 1;
  // ノード（小さい順に描いて大きいものを上に）
  const order = d._order || (d._order = d.nodes.map((_, i) => i));
  order.sort((i, j) => (d.nodes[i][S.sizeBy] || 0) - (d.nodes[j][S.sizeBy] || 0));
  for (const i of order) {
    const n = d.nodes[i], [x, y] = P(n), r = R(n) / Math.sqrt(t.k);
    const removed = S.removed.has(i);
    let col = cm.idx(n) >= 0 ? PAL[cm.idx(n)] : other;
    if (inf) col = inf.has(i) ? bad : other;
    let a = 1;
    if (S.trace) {
      const dep = S.trace.depth.get(i);
      if (i === S.trace.root) col = css("--ink");
      else if (dep != null && dep <= S.trace.shown) col = PAL[Math.min(dep, 3) - 1 + (dep === 1 ? 7 : 0)] || PAL[2];
      else { col = other; a = .25; }
    }
    if (removed) a = .12;
    else if (focus >= 0 && !S.trace && i !== focus && !nbr.has(i)) a = .18;
    ctx.globalAlpha = a;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = col; ctx.fill();
    ctx.lineWidth = 1 / t.k; ctx.strokeStyle = panel; ctx.stroke();
    if (i === focus || i === S.hover) { ctx.lineWidth = 2.2 / t.k; ctx.strokeStyle = hl; ctx.stroke(); }
    if (S.cut && S.cut.has(i)) { ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(x, y, r + 4 / t.k, 0, Math.PI * 2); ctx.lineWidth = 3 / t.k; ctx.strokeStyle = bad; ctx.stroke(); }
  }
  ctx.globalAlpha = 1;
  // PageRank の点数が，リンクをたどって流れる様子（点が線の上を動く）
  if (S.flow) {
    const f = S.flow, e = f.t < 0 ? 0 : f.t > 1 ? 1 : f.t, ease = e * e * (3 - 2 * e);
    ctx.fillStyle = css("--bad");
    for (const [a2, b2, amt] of f.edges) {
      const [x1, y1] = P(d.nodes[a2]), [x2, y2] = P(d.nodes[b2]);
      const r = (1.2 + 4.5 * Math.sqrt(amt / f.max)) / Math.sqrt(t.k);
      ctx.globalAlpha = .85;
      ctx.beginPath(); ctx.arc(x1 + (x2 - x1) * ease, y1 + (y2 - y1) * ease, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // ラベル：大きい順に重ならないよう配置
  const placed = [];
  const fs = 11.5 / t.k;
  ctx.font = `500 ${fs}px ${css("--f-body")}`;
  ctx.textAlign = "center"; ctx.textBaseline = "bottom";
  const cand = [...order].reverse().filter(i => !S.removed.has(i));
  const maxLabels = focus >= 0 ? 40 : (d.nodes.length > 300 ? 22 : d.nodes.length > 60 ? 30 : 40);
  const must = focus >= 0 ? [focus, ...d.adj[focus]] : [];
  let count = 0;
  for (const i of [...new Set([...must, ...cand])]) {
    if (count >= maxLabels) break;
    const n = d.nodes[i], [x, y] = P(n), r = R(n) / Math.sqrt(t.k);
    const sx = x * t.k + t.x, sy = y * t.k + t.y;
    if (sx < -50 || sx > W + 50 || sy < 0 || sy > H) continue;
    const w = ctx.measureText(n.label).width * t.k, h = 15;
    const box = [sx - w / 2 - 3, sy - r * t.k - h - 2, w + 6, h];
    if (placed.some(b => b[0] < box[0] + box[2] && box[0] < b[0] + b[2] && b[1] < box[1] + box[3] && box[1] < b[1] + b[3])) continue;
    placed.push(box); count++;
    ctx.globalAlpha = .82; ctx.fillStyle = panel;
    ctx.fillRect(x - (w / 2 + 3) / t.k, y - r - (h + 2) / t.k, (w + 6) / t.k, h / t.k);
    ctx.globalAlpha = 1; ctx.fillStyle = css("--ink");
    ctx.fillText(n.label, x, y - r - 3 / t.k);
  }
  ctx.restore();
  renderLegend(cm);
}

function arrow(x1, y1, x2, y2, r, col, k) {
  const ang = Math.atan2(y2 - y1, x2 - x1), L = 8 / k;
  const ex = x2 - Math.cos(ang) * (r + 1 / k), ey = y2 - Math.sin(ang) * (r + 1 / k);
  ctx.globalAlpha = .95; ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(ex, ey);
  ctx.lineTo(ex - L * Math.cos(ang - .4), ey - L * Math.sin(ang - .4));
  ctx.lineTo(ex - L * Math.cos(ang + .4), ey - L * Math.sin(ang + .4));
  ctx.closePath(); ctx.fill();
}

function renderLegend(cm) {
  const el = $("#legend");
  if (S.trace) {
    const T = S.trace, lab = T.labels;
    el.innerHTML = `<span><i style="background:${css("--ink")}"></i>選んだ点</span><span><i style="background:${PAL[7]}"></i>${lab[0]}</span>` +
      (T.mode === "all" ? `<span><i style="background:${PAL[1]}"></i>${lab[1]}</span><span><i style="background:${PAL[2]}"></i>${lab[2]}</span>` : "");
    return;
  }
  if (S.infected) { el.innerHTML = `<span><i style="background:${css("--bad")}"></i>影響を受けた</span><span><i style="background:${css("--other")}"></i>まだ影響なし</span>`; return; }
  el.innerHTML = cm.legend.map(([l, i]) => `<span><i style="background:${PAL[i]}"></i>${esc(l)}</span>`).join("") +
    (cm.more ? `<span><i style="background:${css("--other")}"></i>${cm.moreLabel || "その他"}</span>` : "") +
    (S.compFrame && S.frameInfo ? `<span><i style="background:transparent;border:2px solid ${css("--ink2")};border-radius:3px"></i>枠＝まとまり（${S.frameInfo.n}個${S.frameInfo.singles ? `，ほかに1点だけ ${S.frameInfo.singles}` : ""}）</span>` : "") +
    (S.cut && S.cut.size ? `<span><i style="background:transparent;border:2px solid ${css("--bad")}"></i>切り離された点</span>` : "") +
    `<span>大きさ：${S.sizeBy === "_pr" ? "PageRank（計算の途中）" : esc(sizeOptions(S.d).find(o => o[0] === S.sizeBy)?.[1] || "")}</span>`;
}

const zoom = d3.zoom().scaleExtent([.4, 30]).on("zoom", e => { S.t = e.transform; S.tab === "lab" ? drawLab() : S.tab === "pheme" ? drawCasc() : draw(); });
d3.select(cv).call(zoom).on("dblclick.zoom", null);
$("#zin").onclick = () => d3.select(cv).transition().duration(250).call(zoom.scaleBy, 1.6);
$("#zout").onclick = () => d3.select(cv).transition().duration(250).call(zoom.scaleBy, 1 / 1.6);
$("#zfit").onclick = () => d3.select(cv).transition().duration(300).call(zoom.transform, d3.zoomIdentity);

function pick(ev) {
  if (!quad) return -1;
  const r = cv.getBoundingClientRect();
  const [mx, my] = S.t.invert([ev.clientX - r.left, ev.clientY - r.top]);
  const n = quad.find(mx, my, 18 / S.t.k);
  return n ? S.d.idx.get(n.id) : -1;
}
cv.addEventListener("mousemove", ev => {
  if (S.tab === "lab") return;
  if (S.tab === "pheme") return cascHover(ev);
  const i = pick(ev);
  if (i !== S.hover) { S.hover = i; draw(); }
  if (i >= 0) {
    const n = S.d.nodes[i], r = $("#stage").getBoundingClientRect();
    tip.innerHTML = `<b>${esc(n.label)}</b><br>${tipLines(n).map(([k, v]) => `<span class="k">${k}</span> ${v}`).join("<br>")}`;
    tip.hidden = false;
    const x = ev.clientX - r.left + 14, y = ev.clientY - r.top + 14;
    tip.style.left = Math.min(x, r.width - 290) + "px"; tip.style.top = Math.min(y, r.height - 120) + "px";
  } else tip.hidden = true;
});
cv.addEventListener("mouseleave", () => { tip.hidden = true; S.hover = -1; draw(); });
cv.addEventListener("click", ev => {
  if (S.tab === "lab" || S.tab === "pheme") return;
  const i = pick(ev);
  if (S.paint && i >= 0) { paintNode(i); return; }
  select(i);
});

function tipLines(n) {
  const d = S.d, L = [["次数", n.deg]];
  if (d.directed) L.push(["入次数／出次数", `${n.in}／${n.out}`]);
  if (n.papers != null) L.push(["論文数", n.papers]);
  if (n.affected != null) L.push(["影響が及びうる数", `${n.affected} ライブラリ`]);
  L.push(["媒介中心性", fmt(n.btw)]);
  return L;
}

function select(i) {
  S.sel = i; S.trace = null; draw(); renderDetail();
  if (S.pr) prReadout();
}

/* ---------- 取り除く前と後を並べる */
function compIds(d, removed) {
  const n = d.nodes.length, id = new Int32Array(n).fill(-1), sizes = [];
  for (let i = 0; i < n; i++) {
    if (id[i] >= 0 || removed.has(i)) continue;
    const c = sizes.length; let size = 0; const st = [i]; id[i] = c;
    while (st.length) { const v = st.pop(); size++; for (const u of d.adj[v]) if (id[u] < 0 && !removed.has(u)) { id[u] = c; st.push(u); } }
    sizes.push(size);
  }
  return { id, sizes };
}
// 最大のまとまりの中の平均距離（向きは無視）。大きな網では一部の点から測った推定値
function avgDistGiant(d, removed, comp) {
  const big = comp.sizes.indexOf(Math.max(...comp.sizes));
  const members = d.nodes.map((_, i) => i).filter(i => comp.id[i] === big);
  if (members.length < 2) return null;
  const R = rng(3), src = members.length <= 60 ? members : d3.range(60).map(() => members[Math.floor(R() * members.length)]);
  let tot = 0, cnt = 0;
  const dist = new Int32Array(d.nodes.length);
  for (const s0 of src) {
    dist.fill(-1); dist[s0] = 0; const q = [s0];
    for (let h = 0; h < q.length; h++) { const v = q[h]; for (const u of d.adj[v]) if (dist[u] < 0 && !removed.has(u)) { dist[u] = dist[v] + 1; q.push(u); } }
    for (const i of members) if (dist[i] > 0) { tot += dist[i]; cnt++; }
  }
  return cnt ? tot / cnt : null;
}

/* ---------- 実験3：PageRank のくり返し計算を見せる */
let prTimer = null, flowRaf = 0;
const ALPHA = .85;
function prOutLists(d) {
  if (d._outW) return;
  // 有向：a→b（派生→元，利用→依存先）に点数が流れる。無向：両向きに流れる。重みがあれば重みに比例して山分け
  d._outL = d.nodes.map(() => []);
  for (const [a, b, w] of d.E) { d._outL[a].push([b, w]); if (!d.directed) d._outL[b].push([a, w]); }
  d._outW = d._outL.map(L => L.reduce((s0, e) => s0 + e[1], 0));
}
function prStart() {
  const d = S.d; prOutLists(d); stopSpread(); S.paint = false; S.trace = null;
  const n = d.nodes.length;
  S.pr = { it: 0, val: new Float64Array(n).fill(1 / n), prevSize: S.sizeBy, delta: null };
  d.nodes.forEach(nd => nd._pr = 1 / n);
  S.sizeBy = "_pr"; draw(); prReadout();
}
function prStep(done) {
  const d = S.d; if (!S.pr) prStart();
  if (S.flow) return;
  const n = d.nodes.length, old = S.pr.val, nv = new Float64Array(n);
  let dangling = 0; const flows = [];
  for (let u = 0; u < n; u++) {
    if (!d._outW[u]) { dangling += old[u]; continue; }
    for (const [v, w] of d._outL[u]) { const amt = ALPHA * old[u] * w / d._outW[u]; nv[v] += amt; flows.push([u, v, amt]); }
  }
  for (let v = 0; v < n; v++) nv[v] += (1 - ALPHA) / n + ALPHA * dangling / n;
  flows.sort((a, b) => b[2] - a[2]);
  const shown = flows.slice(0, 350);
  S.flow = { edges: shown, max: shown.length ? shown[0][2] : 1, t: 0 };
  const t0 = performance.now(), dur = 750;
  const anim = now => {
    S.flow.t = (now - t0) / dur; draw();
    if (S.flow.t < 1) { flowRaf = setTimeout(() => anim(performance.now()), 16); return; }
    S.flow = null;
    let delta = 0; for (let i = 0; i < n; i++) delta += Math.abs(nv[i] - old[i]);
    S.pr.val = nv; S.pr.it++; S.pr.delta = delta;
    d.nodes.forEach((nd, i) => nd._pr = nv[i]);
    draw(); prReadout();
    if (done) done();
  };
  flowRaf = setTimeout(() => anim(performance.now()), 16);
}
function prAuto() {
  let k = 0;
  const go = () => { if (!S.pr || k++ >= 10) return; prStep(() => { prTimer = setTimeout(go, 150); }); };
  go();
}
function prEnd() {
  clearTimeout(prTimer); clearTimeout(flowRaf); S.flow = null;
  if (S.pr) S.sizeBy = S.pr.prevSize;
  S.pr = null; draw(); prReadout();
}
function prReadout() {
  const el = $("#prOut"); if (!el) return;
  const d = S.d;
  if (!S.pr) { el.innerHTML = "「始める」を押そう。"; return; }
  const P = S.pr, n = d.nodes.length, R = rng(1);
  const top = d.nodes.map((nd, i) => i).sort((a, b) => P.val[b] - P.val[a]).slice(0, 5);
  let html = `くり返し <b>${P.it}</b> 回目` + (P.delta != null ? `　前回からの変化（合計）${P.delta.toFixed(4)}` : "") +
    `<table class="rank" style="margin-top:4px"><tr><td></td><td class="name"><b>いまの上位5</b></td><td class="n">いまの値</td><td class="n">最終の値</td></tr>` +
    top.map((i, r) => `<tr><td class="r">${r + 1}</td><td class="name">${esc(d.nodes[i].label)}</td><td class="n">${P.val[i].toFixed(4)}</td><td class="n">${fmt(d.nodes[i].pr, 4)}</td></tr>`).join("") + "</table>";
  if (S.sel >= 0) {
    const v = S.sel, from = [];
    for (let u = 0; u < n; u++) for (const [t2, w] of d._outL[u]) if (t2 === v) from.push([u, P.val[u] * w / d._outW[u]]);
    from.sort((a, b) => b[1] - a[1]);
    html += `<p class="note" style="margin-top:6px"><b>${esc(d.nodes[v].label)}</b> の次の値 ＝ 0.15/${n} ＋ 0.85 ×（${from.slice(0, 4).map(([u, x]) => `${esc(d.nodes[u].label)} から ${x.toFixed(4)}`).join("，")}${from.length > 4 ? ` ほか${from.length - 4}件` : ""}）</p>`;
  }
  el.innerHTML = html;
}

function removeBy(mode, k) {

}

let spTimer = null;
function startSpread(seed) {
  stopSpread(true); if (S.pr) prEnd(); S.trace = null;
  const d = S.d, beta = +$("#beta").value, R = rng(Date.now());
  const nb = d.directed ? d.inn : d.adj;
  S.infected = new Set([seed]); S.infHist = [1];
  let frontier = [seed];
  select(seed);
  S.sel = -1;
  const tick = () => {
    // 有向：新しく壊れたノードから，それを使う側へ伝わる／無向：知っている人全員が毎ステップ隣に伝える（SIモデル）
    const from = d.directed ? frontier : [...S.infected], next = [];
    for (const v of from) for (const u of nb[v]) if (!S.infected.has(u) && R() < beta) { S.infected.add(u); next.push(u); }
    frontier = next;
    S.infHist.push(S.infected.size);
    draw(); drawSpread();
    const stuck = S.infHist.length > 4 && S.infHist.slice(-4).every(v => v === S.infected.size);
    if (stuck || S.infHist.length > 40) { clearInterval(spTimer); spTimer = null; }

  spTimer = setInterval(tick, 380);
}

function genModel(m, n, k, p, R) {
  const E = new Set(), key = (a, b) => a < b ? `${a}-${b}` : `${b}-${a}`;
  const add = (a, b) => { if (a !== b) E.add(key(a, b)); };
  if (m === "er") { const M = Math.round(n * k / 2); while (E.size < M) add(Math.floor(R() * n), Math.floor(R() * n)); }
  else if (m === "ws") {
    for (let i = 0; i < n; i++) for (let j = 1; j <= k / 2; j++) {
      let t = (i + j) % n;
      if (R() < p) { do { t = Math.floor(R() * n); } while (t === i || E.has(key(i, t))); }
      add(i, t);
    }
  } else {
    const mm = Math.max(1, k / 2), targets = [];
    for (let i = 0; i <= mm; i++) for (let j = 0; j < i; j++) { add(i, j); targets.push(i, j); }
    for (let v = mm + 1; v < n; v++) {
      const chosen = new Set();
      while (chosen.size < mm) chosen.add(targets[Math.floor(R() * targets.length)]); // 次数に比例して選ぶ（優先的選択）
      for (const u of chosen) { add(v, u); targets.push(v, u); }
    }
  }
  return [...E].map(s => s.split("-").map(Number));
}

function makeModel(grow) {
  clearInterval(labTimer); labTimer = null;
  const m = $("#gm").value, n = +$("#gn").value, k = +$("#gk").value, p = +$("#gp").value;
  const E = genModel(m, n, k, p, rng(Math.floor(Math.random() * 1e9)));
  const nodes = d3.range(n).map(i => ({ id: String(i), label: String(i) }));
  if (m === "ws") nodes.forEach((d, i) => { d.x = Math.cos(i / n * 2 * Math.PI) * 300; d.y = Math.sin(i / n * 2 * Math.PI) * 300; });
  LAB = { nodes, E, kind: "model", m };
  const deg = new Array(n).fill(0); E.forEach(([a, b]) => { deg[a]++; deg[b]++; });
  nodes.forEach((d, i) => d.deg = deg[i]);
  labStats(n, E, deg);
  if (grow) { // 成長の様子：ノードを追加順に表示
    LAB.visible = 10;
    labTimer = setInterval(() => { LAB.visible = Math.min(n, LAB.visible + Math.ceil(n / 60)); drawLab(); if (LAB.visible >= n) { clearInterval(labTimer); labTimer = null; } }, 120);
  } else LAB.visible = n;
  startForce(m === "ws");
}

function labStats(n, E, deg) {
  const adj = d3.range(n).map(() => []); E.forEach(([a, b]) => { adj[a].push(b); adj[b].push(a); });
  let tot = 0, cnt = 0;
  const srcs = d3.range(Math.min(n, 120));
  for (const s of srcs) { const dist = new Int32Array(n).fill(-1); dist[s] = 0; const q = [s]; for (let h = 0; h < q.length; h++) { const v = q[h]; for (const u of adj[v]) if (dist[u] < 0) { dist[u] = dist[v] + 1; q.push(u); } } for (let i = 0; i < n; i++) if (dist[i] > 0) { tot += dist[i]; cnt++; } }
  let cc = 0;
  for (let v = 0; v < n; v++) { const nb = adj[v], kk = nb.length; if (kk < 2) continue; const s = new Set(nb); let t = 0; for (const a of nb) for (const b of adj[a]) if (b > a && s.has(b)) t++; cc += t / (kk * (kk - 1) / 2); }
  $("#gstats").innerHTML = statBox((tot / cnt).toFixed(2), "平均距離") + statBox((cc / n).toFixed(3), "クラスター係数") + statBox(d3.max(deg), "最大次数");
  const svg = d3.select("#ghist"); svg.selectAll("*").remove();
  const counts = d3.rollups(deg, v => v.length, d => d).sort((a, b) => a[0] - b[0]);
  const x = d3.scaleLinear().domain([0, d3.max(deg) + 1]).range([38, 330]), y = d3.scaleLinear().domain([0, d3.max(counts, c => c[1])]).nice().range([128, 20]);
  svg.append("g").attr("transform", "translate(0,128)").call(d3.axisBottom(x).ticks(6).tickSize(3));
  svg.append("g").attr("transform", "translate(38,0)").call(d3.axisLeft(y).ticks(3).tickSize(3));
  svg.selectAll(".domain, .tick line").attr("stroke", css("--line"));
  const bw = Math.max(1.5, (x(1) - x(0)) - 2);
  svg.append("g").selectAll("rect").data(counts).join("rect").attr("x", c => x(c[0]) - bw / 2).attr("y", c => y(c[1])).attr("width", bw).attr("height", c => 128 - y(c[1])).attr("fill", PAL[0]).attr("rx", 1.5);
  svg.append("text").attr("x", 330).attr("y", 160).attr("text-anchor", "end").text("次数（つながりの数）");
  svg.append("text").attr("x", 40).attr("y", 8).text("ノード数");
}

function startForce(ring) {

  LAB.links = links;
  labSim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).distance(ring ? 14 : 22).strength(ring ? .05 : .4))
    .force("charge", d3.forceManyBody().strength(ring ? -6 : -26))
    .force("x", d3.forceX(0).strength(.04)).force("y", d3.forceY(0).strength(.04))
    .alphaDecay(.02)
    .on("tick", drawLab);
  if (ring) labSim.force("link").strength(0.0);
  S.t = d3.zoomIdentity; d3.select(cv).call(zoom.transform, d3.zoomIdentity);
}

/* ---------- C. 3つのモデルを並べる */
function labAdj(n, E) { const a = d3.range(n).map(() => []); E.forEach(([x, y]) => { a[x].push(y); a[y].push(x); }); return a; }
function labGiant(n, adj, removed) {
  const seen = new Uint8Array(n); let best = 0;
  for (let i = 0; i < n; i++) {
    if (seen[i] || removed.has(i)) continue;
    let size = 0; const st = [i]; seen[i] = 1;
    while (st.length) { const v = st.pop(); size++; for (const u of adj[v]) if (!seen[u] && !removed.has(u)) { seen[u] = 1; st.push(u); } }
    best = Math.max(best, size);
  }
  return best / n;
}
function labMetrics(n, adj) {
  let tot = 0, cnt = 0;
  for (const s0 of d3.range(Math.min(n, 120))) { const dist = new Int32Array(n).fill(-1); dist[s0] = 0; const q = [s0]; for (let h = 0; h < q.length; h++) { const v = q[h]; for (const u of adj[v]) if (dist[u] < 0) { dist[u] = dist[v] + 1; q.push(u); } } for (let i = 0; i < n; i++) if (dist[i] > 0) { tot += dist[i]; cnt++; } }
  let cc = 0;
  for (let v = 0; v < n; v++) { const nb = adj[v], kk = nb.length; if (kk < 2) continue; const st = new Set(nb); let t = 0; for (const a of nb) for (const b of adj[a]) if (b > a && st.has(b)) t++; cc += t / (kk * (kk - 1) / 2); }
  return { L: tot / cnt, C: cc / n };
}
function makeCompare() {
  clearInterval(labTimer); labTimer = null; if (labSim) labSim.stop();
  const n = +$("#gn").value, k = +$("#gk").value, R = rng(Math.floor(Math.random() * 1e9));
  const specs = [["er", "ランダム", 0], ["ws", "スモールワールド", .1], ["ba", "スケールフリー", 0]];
  const parts = specs.map(([m, name, p]) => {
    let E = genModel(m, n, k, p, R);
    const nodes = d3.range(n).map(i => ({ index: i }));
    if (m === "ws") nodes.forEach((d, i) => { d.x = Math.cos(i / n * 2 * Math.PI) * 100; d.y = Math.sin(i / n * 2 * Math.PI) * 100; });
    else d3.forceSimulation(nodes).force("link", d3.forceLink(E.map(([a, b]) => ({ source: a, target: b }))).distance(12).strength(.5))
      .force("charge", d3.forceManyBody().strength(-14)).force("x", d3.forceX(0).strength(.06)).force("y", d3.forceY(0).strength(.06)).stop().tick(260);
    const adj = labAdj(n, E), deg = adj.map(a => a.length);
    const hubs = new Set(d3.range(n).sort((a, b) => deg[b] - deg[a]).slice(0, Math.round(n * .05)));
    let rnd = 0; for (let r = 0; r < 10; r++) { const o = d3.shuffle(d3.range(n)); rnd += labGiant(n, adj, new Set(o.slice(0, hubs.size))) / 10; }
    return { name, nodes, E, adj, deg, hubs, met: labMetrics(n, adj), giant0: labGiant(n, adj, new Set()), giantHub: labGiant(n, adj, hubs), giantRnd: rnd };
  });
  LAB = { kind: "compare", parts, cut: false, nodes: [] };
  S.t = d3.zoomIdentity; d3.select(cv).call(zoom.transform, d3.zoomIdentity);
  const pc = v => (v * 100).toFixed(0) + "%";
  $("#cmpTable").innerHTML = `<tr><td class="name"></td>${parts.map(P => `<td class="n"><b>${P.name}</b></td>`).join("")}</tr>` +
    [["平均距離", P => P.met.L.toFixed(2)], ["クラスター係数", P => P.met.C.toFixed(3)], ["最大次数", P => d3.max(P.deg)],
     ["ハブ5%を除いた後", P => pc(P.giantHub)], ["ランダム5%を除いた後", P => pc(P.giantRnd)]]
      .map(([l, f]) => `<tr><td class="name">${l}</td>${parts.map(P => `<td class="n">${f(P)}</td>`).join("")}</tr>`).join("");
  drawLab();
}
function drawCompare() {
  const t = S.t, parts = LAB.parts, pw = W / 3, panel = css("--panel");
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
  parts.forEach((P, k) => {
    const ext = 1.08 * (d3.max(P.nodes, d => Math.max(Math.abs(d.x), Math.abs(d.y))) || 1);
    const sc = Math.min(pw - 16, H - 130) / 2 / ext, cx = pw * k + pw / 2, cy = H / 2 + 14;
    ctx.save(); ctx.translate(t.x, t.y); ctx.scale(t.k, t.k);
    ctx.strokeStyle = css("--edge"); ctx.globalAlpha = .5; ctx.lineWidth = .7 / t.k; ctx.beginPath();
    for (const [a, b] of P.E) { if (LAB.cut && (P.hubs.has(a) || P.hubs.has(b))) continue; ctx.moveTo(cx + P.nodes[a].x * sc, cy + P.nodes[a].y * sc); ctx.lineTo(cx + P.nodes[b].x * sc, cy + P.nodes[b].y * sc); }
    ctx.stroke(); ctx.globalAlpha = 1;
    const maxd = d3.max(P.deg) || 1;
    P.nodes.forEach((d, i) => {
      const r = (2 + 9 * Math.sqrt(P.deg[i] / maxd)) / Math.sqrt(t.k), hub = P.hubs.has(i);
      ctx.globalAlpha = LAB.cut && hub ? .15 : 1;
      ctx.beginPath(); ctx.arc(cx + d.x * sc, cy + d.y * sc, r, 0, Math.PI * 2);
      ctx.fillStyle = hub ? css("--bad") : PAL[[0, 2, 1][k]]; ctx.fill(); ctx.lineWidth = .8 / t.k; ctx.strokeStyle = panel; ctx.stroke();
    });
    ctx.restore(); ctx.globalAlpha = 1;
    ctx.fillStyle = css("--ink"); ctx.font = `700 14px ${css("--f-body")}`; ctx.textAlign = "center"; ctx.textBaseline = "top";
    ctx.fillText(P.name, cx, 84);
    ctx.font = `500 12px ${css("--f-mono")}`; ctx.fillStyle = css("--ink2");
    ctx.fillText(LAB.cut ? `最大のまとまり ${(P.giant0 * 100).toFixed(0)}% → ${(P.giantHub * 100).toFixed(0)}%` : `平均距離 ${P.met.L.toFixed(2)}　C ${P.met.C.toFixed(2)}`, cx, 104);
  });
  $("#legend").innerHTML = `<span><i style="background:${css("--bad")}"></i>ハブ上位5%</span><span>大きさ：次数</span>${LAB.cut ? "<span>ハブを取り除いた状態</span>" : ""}`;
}

function drawLab() {
  if (S.tab !== "lab" || !LAB) return;
  if (LAB.kind === "compare") return drawCompare();
  const t = S.t, nodes = LAB.nodes;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
  const ext = 1.1 * (d3.max(nodes, d => Math.max(Math.abs(d.x), Math.abs(d.y))) || 1);
  const s = Math.min(W, H - 90) / 2 / ext;
  ctx.save(); ctx.translate(t.x, t.y); ctx.scale(t.k, t.k); ctx.translate(W / 2, H / 2 + 10);
  const vis = LAB.visible ?? nodes.length;
  ctx.strokeStyle = css("--edge"); ctx.globalAlpha = .6; ctx.lineWidth = .8 / t.k;
  ctx.beginPath();
  for (const l of LAB.links) { if (l.source.index >= vis || l.target.index >= vis) continue; ctx.moveTo(l.source.x * s, l.source.y * s); ctx.lineTo(l.target.x * s, l.target.y * s); }
  ctx.stroke(); ctx.globalAlpha = 1;
  const deg = new Map(); for (const l of LAB.links) if (l.source.index < vis && l.target.index < vis) { deg.set(l.source.index, (deg.get(l.source.index) || 0) + 1); deg.set(l.target.index, (deg.get(l.target.index) || 0) + 1); }
  const maxd = d3.max([...deg.values()]) || 1;
  for (const d of nodes) {
    if (d.index >= vis) continue;
    const r = LAB.kind === "echo" ? 4.5 : 2.5 + 11 * Math.sqrt((deg.get(d.index) || 0) / maxd);
    ctx.beginPath(); ctx.arc(d.x * s, d.y * s, r / Math.sqrt(t.k), 0, Math.PI * 2);
    ctx.fillStyle = LAB.kind === "echo" ? PAL[d.op] : PAL[1]; ctx.fill();
    ctx.lineWidth = 1 / t.k; ctx.strokeStyle = css("--panel"); ctx.stroke();
  }
  ctx.restore();
  const lg = $("#legend");
  lg.innerHTML = LAB.kind === "echo" ? `<span><i style="background:${PAL[0]}"></i>意見A</span><span><i style="background:${PAL[1]}"></i>意見B</span>` : `<span>大きさ：次数</span>${vis < nodes.length ? `<span>成長中：${vis} / ${nodes.length} ノード</span>` : ""}`;
}

function runEcho() {
  clearInterval(labTimer);
  const n = 120, k = 6, R = rng(Math.floor(Math.random() * 1e9)), phi = +$("#phi").value;
  const E = genModel("er", n, k, 0, R);
  const nodes = d3.range(n).map(i => ({ id: String(i), op: R() < .5 ? 0 : 1 }));
  LAB = { nodes, E, kind: "echo" };
  LAB.visible = n;
  startForce(false);
  labSim.force("charge").strength(-18);
  const hist = [];
  const adj = () => { const a = d3.range(n).map(() => new Set()); LAB.links.forEach(l => { a[l.source.index].add(l.target.index); a[l.target.index].add(l.source.index); }); return a; };
  const cross = () => LAB.links.filter(l => nodes[l.source.index].op !== nodes[l.target.index].op).length / LAB.links.length;
  hist.push(cross());
  labTimer = setInterval(() => {
    const A = adj();
    for (let s = 0; s < 40; s++) {
      const li = Math.floor(R() * LAB.links.length), l = LAB.links[li];
      let v = l.source.index, u = l.target.index; if (R() < .5) [v, u] = [u, v];
      if (nodes[v].op === nodes[u].op) continue;
      if (R() < phi) {
        const cand = d3.range(n).filter(w => w !== v && nodes[w].op === nodes[v].op && !A[v].has(w));
        if (!cand.length) continue;
        const w = cand[Math.floor(R() * cand.length)];
        A[v].delete(u); A[u].delete(v); A[v].add(w); A[w].add(v);
        LAB.links[li] = { source: nodes[v], target: nodes[w] };
      } else nodes[v].op = nodes[u].op;
    }
    labSim.force("link").links(LAB.links); labSim.alpha(.5).restart();
    hist.push(cross());
    drawEcho(hist);
    if (hist.length > 120 || hist[hist.length - 1] === 0) { clearInterval(labTimer); labTimer = null; }
  }, 160);
  drawEcho(hist);
}
function drawEcho(h) {
  const svg = d3.select("#echoChart"); if (svg.empty()) return; svg.selectAll("*").remove();
  $("#phiOut").innerHTML = `φ = ${$("#phi").value}　異なる意見どうしのつながり：<b>${(h[h.length - 1] * 100).toFixed(0)}%</b>`;
  const x = d3.scaleLinear().domain([0, 120]).range([38, 330]), y = d3.scaleLinear().domain([0, 60]).range([108, 8]);
  svg.append("g").attr("transform", "translate(0,108)").call(d3.axisBottom(x).ticks(5).tickSize(3));
  svg.append("g").attr("transform", "translate(38,0)").call(d3.axisLeft(y).ticks(3).tickFormat(v => v + "%").tickSize(3));
  svg.selectAll(".domain, .tick line").attr("stroke", css("--line"));
  svg.append("path").attr("d", d3.line().x((_, i) => x(i)).y(v => y(Math.min(60, v * 100)))(h)).attr("fill", "none").attr("stroke", PAL[0]).attr("stroke-width", 2.2);
  svg.append("text").attr("x", 330).attr("y", 138).attr("text-anchor", "end").text("時間");
}

/* ============================================================ うわさへの反応（PHEME の返信カスケード） */

function curCasc() { return PH.cascades.find(c => c.id === C.id) || cascList()[0]; }
const fmtMin = m => m < 60 ? `${Math.round(m)}分` : m < 1440 ? `${(m / 60).toFixed(1)}時間` : `${(m / 1440).toFixed(1)}日`;

/* 時間スライダーは対数目盛り（最初の数分の動きを見やすくする） */
const maxMin = () => d3.max(curCasc().nodes, n => n.t) || 1;
function sliderToMin(v) { return v >= 1000 ? 1e9 : Math.pow(10, v / 1000 * Math.log10(maxMin() + 1)) - 1; }
function minToSlider(m) { return Math.round(Math.log10(m + 1) / Math.log10(maxMin() + 1) * 1000); }
function cascColor(t) { const v = Math.min(1, Math.log10(t + 1) / 3); return d3.interpolateRgb(PAL[0], css("--other"))(v); }
function cascXY() {
  const c = curCasc(), ext = d3.max(c.nodes, n => Math.max(Math.abs(n.x), Math.abs(n.y))) || 1;
  const s = Math.min(W, H - 90) / 2 / ext * 0.92;
  return n => [W / 2 + n.x * s, H / 2 + 12 + n.y * s];
}

function drawCasc() {
  if (S.tab !== "pheme") return;
  const c = curCasc(), t = S.t, P = cascXY();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
  ctx.save(); ctx.translate(t.x, t.y); ctx.scale(t.k, t.k);

  for (const [a, b] of c.links) {

  }
  ctx.stroke(); ctx.globalAlpha = 1;
  c.nodes.forEach((n, i) => {

    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = i === 0 ? css("--ink") : cascColor(n.t); ctx.fill();

}

function cascHover(ev) {
  const c = curCasc(), P = cascXY(), r = cv.getBoundingClientRect();
  const [mx, my] = S.t.invert([ev.clientX - r.left, ev.clientY - r.top]);
  let best = -1, bd = 12 / S.t.k;
  c.nodes.forEach((n, i) => {
    if (n.t > C.T) return;
    const [x, y] = P(n), dd = Math.hypot(x - mx, y - my);
    if (dd < bd) { bd = dd; best = i; }

    const n = c.nodes[best], sr = $("#stage").getBoundingClientRect();

}

    .attr("fill", "none").attr("stroke", PAL[1]).attr("stroke-width", 2.2);
  if (C.T < 1e9) svg.append("line").attr("x1", x(C.T + 1)).attr("x2", x(C.T + 1)).attr("y1", 12).attr("y2", 108).attr("stroke", css("--ink2")).attr("stroke-dasharray", "3 3");
  svg.append("text").attr("x", 330).attr("y", 136).attr("text-anchor", "end").text("元投稿からの時間");
  svg.append("text").attr("x", 40).attr("y", 8).text("返信の累積割合");
  // 事件ごとの「返信がつくまでの時間」
  svg = d3.select("#cBars"); svg.selectAll("*").remove();
  const be = PH.byEvent, xb = d3.scaleLinear().domain([0, d3.max(be, b => Math.max(b.medRumor, b.medNon))]).nice().range([128, 320]);
  const yb = d3.scaleBand().domain(be.map(b => b.event)).range([8, 180]).padding(.25);
  svg.append("g").attr("transform", "translate(0,180)").call(d3.axisBottom(xb).ticks(4).tickFormat(v => v + "分").tickSize(3));
  svg.selectAll(".domain, .tick line").attr("stroke", css("--line"));
  be.forEach(b => {
    const y0 = yb(b.event), h = yb.bandwidth() / 2 - 1;
    svg.append("text").attr("x", 124).attr("y", y0 + yb.bandwidth() / 2 + 3).attr("text-anchor", "end").text(b.eventJa.replace(/（.*）/, "")).style("font-size", "9px");
    svg.append("rect").attr("x", 128).attr("y", y0).attr("width", xb(b.medRumor) - 128).attr("height", h).attr("rx", 2).attr("fill", css("--bad"));
    svg.append("rect").attr("x", 128).attr("y", y0 + h + 2).attr("width", xb(b.medNon) - 128).attr("height", h).attr("rx", 2).attr("fill", PAL[0]);
  });
  svg.append("rect").attr("x", 112).attr("y", 194).attr("width", 10).attr("height", 8).attr("fill", css("--bad"));
  svg.append("text").attr("x", 126).attr("y", 202).text("うわさ");
  svg.append("rect").attr("x", 176).attr("y", 194).attr("width", 10).attr("height", 8).attr("fill", PAL[0]);
  svg.append("text").attr("x", 190).attr("y", 202).text("うわさ以外");
}

/* ============================================================ 読み込み */
function renderTabs() {
  $("#tabs").innerHTML = TABS.map((t, i) => `<button role="tab" aria-selected="${t.key === S.tab}" data-k="${t.key}"><span class="num">${i + 1}</span>${t.label}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { S.tab = b.dataset.k; try { history.replaceState(null, "", "#" + S.tab); } catch (e) {} load(); });
}

function load() {
  renderTabs();
  stopSpread(); if (labSim) labSim.stop(); clearInterval(labTimer); labTimer = null; clearInterval(C.timer); C.timer = null;
  tip.hidden = true;
  $("#detail").hidden = S.tab === "lab" || S.tab === "pheme";
  $("#cmp").hidden = true; clearTimeout(prTimer); prTimer = null; clearTimeout(flowRaf); S.flow = null;
  $("#side").scrollTop = 0;
  S.t = d3.zoomIdentity; d3.select(cv).call(zoom.transform, d3.zoomIdentity);
  if (S.tab === "lab") { S.d = null; quad = null; resize(); renderLab(); return; }
  if (S.tab === "pheme") { S.d = null; quad = null; resize(); renderCasc(); return; }
  const d = prepare(DATA[dsKey()]);
  S.d = d; S.sel = -1; S.hover = -1; S.removed = new Set(); S.cut = null;
  S.pr = null; S.flow = null; S.paint = false; S.trace = null; delete d._grp0;
  const sOpt = sizeOptions(d).map(o => o[0]), cOpt = colorOptions(d).map(o => o[0]);
  S.sizeBy = d.nodes[0].used != null ? "used" : d.directed ? "in" : (d.nodes[0].papers != null ? "papers" : "deg");
  if (!sOpt.includes(S.sizeBy)) S.sizeBy = sOpt[0];
  S.colorBy = d.nodes[0].lean ? "lean" : d.nodes[0].org ? "org" : d.nodes[0].seed !== undefined ? "seed" : "comm";
  if (!cOpt.includes(S.colorBy)) S.colorBy = cOpt[0];
  $("#capTitle").textContent = d.title;
  $("#capSrc").textContent = [NODE_NOTE[S.tab], d.edgeNote].filter(Boolean).join("　");
  S.crossOnly = false;
  resize(); renderSide();
}

function themeChanged() { readPalette(); if (S.tab === "lab") drawLab(); else if (S.tab === "pheme") { drawCasc(); drawCascCharts(); } else { draw(); renderDegree(); drawSpread(); } }
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", themeChanged);
new MutationObserver(themeChanged).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
new ResizeObserver(() => { resize(); if (S.tab === "lab") drawLab(); if (S.tab === "pheme") drawCasc(); if (!$("#cmp").hidden) drawCmp(); }).observe($("#stage"));
const h = (location.hash || "").slice(1);
if (TABS.some(t => t.key === h)) S.tab = h;
load();
</script>
